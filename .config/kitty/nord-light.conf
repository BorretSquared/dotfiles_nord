# Nord Light — high-contrast ANSI for snow backgrounds
# Accents are deepened vs stock Nord so yellow/magenta/cyan stay readable.
foreground #2E3440
background #E5E9F0
cursor #2E3440
cursor_text_color #ECEFF4
selection_foreground #2E3440
selection_background #D8DEE9

# black / bright black
color0  #2E3440
color8  #4C566A

# red / bright red  (nord11 deepened + stock bright)
color1  #A9444E
color9  #BF616A

# green / bright green  (stock nord14 is too pale on snow)
color2  #4F6F3E
color10 #6B8F55

# yellow / bright yellow  (stock #EBCB8B is nearly invisible on light)
color3  #8A6500
color11 #A67C00

# blue / bright blue
color4  #3B6EA5
color12 #5E81AC

# magenta / bright magenta  (stock #B48EAD is washed out)
color5  #7A4A7A
color13 #9B5F9B

# cyan / bright cyan
color6  #2F6F7C
color14 #4A8F9C

# white / bright white  (must be dark-on-light, not snow-on-snow)
color7  #4C566A
color15 #2E3440
