# AirPods Pro 2 Profile Fix
# Always use A2DP stereo sink (AAC/SBC) and prevent auto-switching to headset profile during calls

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.6C_12_70_30_6C_B8"
      }
    ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink"
        bluez5.auto-connect = [ "a2dp_sink" ]
      }
    }
  }
]
