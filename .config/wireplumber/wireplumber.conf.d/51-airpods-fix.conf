-- AirPods Pro 2 Profile Fix
-- Auto-switches to A2DP when connected

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.6C_12_70_30_6C_B8"
      }
    ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink"
        bluez5.auto-connect = [ "a2dp_sink" ]
        api.bluez5.profile.auto-switch = true
      }
    }
  }
]
